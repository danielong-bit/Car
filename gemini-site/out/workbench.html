<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0d12">
  <title>Inventory workbench · Danny Recond Select</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/exhibition.css?v=owner-20261022c">
  <link rel="stylesheet" href="/workbench.css?v=owner-20261022c">
  <link rel="stylesheet" href="/product-system.css?v=bloom-theme-20261024a">
  <script src="/site-theme-init.js?v=owner-20261022c"></script>
<link rel="stylesheet" href="/brand-system.css?v=brand-compact-20261026a"></head>
<body class="workbench">
  <aside class="wb-sidebar"></aside>
  <main class="wb-main">
    <header class="wb-topbar">
      <div>
        <p class="eyebrow brand-eyebrow"><span class="brand-logo full-brand" aria-hidden="true"><img class="brand-logo-img brand-wordmark logo-dark" src="/assets/brand-wordmark-black.png" alt="" width="20" height="14" decoding="async"><img class="brand-logo-img brand-symbol logo-dark" src="/assets/brand-symbol-black.png" alt="" width="20" height="14" decoding="async"><img class="brand-logo-img brand-wordmark logo-light" src="/assets/brand-wordmark-white.png" alt="" width="20" height="14" decoding="async"><img class="brand-logo-img brand-symbol logo-light" src="/assets/brand-symbol-white.png" alt="" width="20" height="14" decoding="async"></span><span>DANNY RECON SELECT</span></p>
        <h1 id="pageHeading">Overview</h1>
      </div>
      <div class="wb-top-actions">
        <span id="saveState">Loading…</span>
        <button type="button" class="button" id="openPreview">Preview showroom</button>
        <button type="button" class="button primary" id="exportUpdate">Export site update</button>
      </div>
    </header>
    <div id="wbLocalBanner" class="wb-local-note" data-state="clean" style="display:none!important">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="wbLocalStatusText">Interactive Workbench Ready</span>
      <button type="button" class="text-button" id="exportHelp">Publishing help</button>
    </div>
    <div id="workspaceContent"></div>
  </main>
  <dialog id="confirmDialog" aria-labelledby="confirmTitle">
    <div class="dialog-head">
      <h3 id="confirmTitle">Confirm Action</h3>
      <button type="button" data-close aria-label="Close dialog">×</button>
    </div>
    <p id="confirmCopy"></p>
    <div class="actions">
      <button type="button" class="button quiet" id="confirmCancel">Cancel</button>
      <button type="button" class="button" id="confirmYes">Confirm</button>
    </div>
  </dialog>
  <dialog id="cardPreview" aria-label="Card preview"></dialog>
  <div class="toast" id="workbenchToast" role="status" hidden></div>
  <script type="module" src="/workbench.mjs?v=owner-20261022c"></script>
</body>
</html>
