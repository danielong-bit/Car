<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
<title id="title">Auction report layout example — not a real vehicle report</title><desc id="desc">Demonstration layout showing an example auction grade of 4.5 and interior grade B. No actual auction, chassis or vehicle inspection data.</desc>
<rect width="1000" height="1200" rx="18" fill="#f8fafc"/><rect x="45" y="45" width="910" height="1110" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="45" y="45" width="910" height="145" rx="10" fill="#0b192c"/><g font-family="Arial,sans-serif"><text x="80" y="105" fill="#38bdf8" font-size="19" letter-spacing="3">DANNY RECON SELECT / EXAMPLE ONLY</text><text x="80" y="155" fill="#f8fafc" font-size="36" font-weight="700">Auction report preview</text>
<rect x="80" y="220" width="840" height="82" rx="6" fill="#fff7df" stroke="#e6d290"/><text x="100" y="254" fill="#77520d" font-size="19" font-weight="700">LAYOUT EXAMPLE — NOT AN ACTUAL AUCTION REPORT</text><text x="100" y="282" fill="#77520d" font-size="17">Grades and markings below do not describe this vehicle.</text>
<g fill="#475569" font-size="18"><text x="85" y="350">AUCTION / LOT</text><text x="500" y="350">CHASSIS / VEHICLE ID</text></g><g fill="#94a3b8" font-size="25"><text x="85" y="391">Not supplied — example</text><text x="500" y="391">Not supplied — example</text></g><path d="M80 415H920" stroke="#e2e8f0"/>
<rect x="80" y="448" width="400" height="170" rx="8" fill="#eff4fa"/><rect x="500" y="448" width="420" height="170" rx="8" fill="#eff4fa"/><g fill="#475569" font-size="19"><text x="105" y="484">EXAMPLE AUCTION GRADE</text><text x="525" y="484">EXAMPLE INTERIOR GRADE</text></g><g fill="#162b4d" font-size="78" font-weight="700"><text x="105" y="576">4.5</text><text x="525" y="576">B</text></g>
<text x="85" y="675" fill="#475569" font-size="18">INSPECTION DIAGRAM / PLACEHOLDER</text><g transform="translate(150 710)" fill="#edf2f7" stroke="#94a3b8" stroke-width="3"><rect x="200" y="0" width="300" height="250" rx="80"/><rect x="223" y="65" width="254" height="117" rx="28"/><rect x="178" y="45" width="28" height="54" rx="9"/><rect x="494" y="45" width="28" height="54" rx="9"/><rect x="178" y="169" width="28" height="54" rx="9"/><rect x="494" y="169" width="28" height="54" rx="9"/></g>
<text x="500" y="1030" text-anchor="middle" fill="#2563eb" font-size="45" font-weight="700" letter-spacing="6">EXAMPLE ONLY</text><text x="500" y="1080" text-anchor="middle" fill="#475569" font-size="18">Replace this preview with the vehicle’s original report in the workbench.</text><text x="500" y="1112" text-anchor="middle" fill="#64748b" font-size="16">No real auction house, inspection record or verification is represented.</text></g></svg>
